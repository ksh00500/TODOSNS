name: mungsil-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mungsil
      POSTGRES_USER: mungsil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mungsil}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mungsil"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-mungsil}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-mungsil-local-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: ["until mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY; do sleep 2; done; mc mb --ignore-existing local/$$MINIO_BUCKET"]
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-mungsil}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-mungsil-local-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-mungsil-media}

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_dev_data:
  redis_dev_data:
  minio_dev_data:
