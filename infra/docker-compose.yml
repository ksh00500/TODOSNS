name: mungsil

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-256m}
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}
    pids_limit: 200
    logging: *default-logging
    environment:
      POSTGRES_DB: mungsil
      POSTGRES_USER: mungsil
      POSTGRES_PASSWORD_FILE: /run/secrets/database_bootstrap_password
    secrets:
      - database_bootstrap_password
      - database_backup_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mungsil"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: ${REDIS_MEMORY_LIMIT:-128m}
    cpus: ${REDIS_CPU_LIMIT:-0.5}
    pids_limit: 100
    logging: *default-logging
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: mungsil-api
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: ${API_MEMORY_LIMIT:-384m}
    cpus: ${API_CPU_LIMIT:-1.0}
    pids_limit: 200
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DEPLOYMENT_SECURITY_PROFILE: internet
      PORT: 4000
      WEB_ORIGIN: https://${APP_DOMAIN}
      DATABASE_URL_FILE: /run/secrets/database_url
      EXPECTED_DB_SESSION_ROLE: mungsil_runtime
      EXPECTED_DB_CURRENT_ROLE: mungsil_runtime
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_REGION: ${STORAGE_REGION:-ap-southeast-2}
      STORAGE_FORCE_PATH_STYLE: "false"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SITE_ORIGIN: https://${APP_DOMAIN}
      INVITE_REQUIRED: ${INVITE_REQUIRED:-true}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Seoul}
      COOKIE_SECURE: "true"
      TRUST_PROXY_HOPS: "1"
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      MEDIA_MAX_BYTES_PER_USER: ${MEDIA_MAX_BYTES_PER_USER:-500000000}
      MEDIA_PROCESS_CONCURRENCY: ${MEDIA_PROCESS_CONCURRENCY:-1}
      MEDIA_PROCESS_TIMEOUT_MS: ${MEDIA_PROCESS_TIMEOUT_MS:-30000}
      MEDIA_READ_URL_TTL_SECONDS: ${MEDIA_READ_URL_TTL_SECONDS:-300}
      ANALYTICS_COLLECTION_ENABLED: "false"
      ANALYTICS_EXPORT_ENABLED: "false"
    expose: ["4000"]
    secrets:
      - source: database_runtime_url
        target: database_url
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["node", "apps/api/scripts/start-runtime.cjs"]

  migrate:
    image: mungsil-api
    profiles: ["migration"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      EXPECTED_DB_SESSION_ROLE: mungsil_migrator
      EXPECTED_DB_CURRENT_ROLE: mungsil_owner
    secrets:
      - source: database_migrator_url
        target: database_url
    command: ["node", "apps/api/scripts/run-migrations.cjs"]

  seed:
    image: mungsil-api
    profiles: ["seed"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      EXPECTED_DB_SESSION_ROLE: mungsil_runtime
      EXPECTED_DB_CURRENT_ROLE: mungsil_runtime
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      SEED_INVITE_CODE: ${SEED_INVITE_CODE}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    secrets:
      - source: database_runtime_url
        target: database_url
    command: ["node", "apps/api/scripts/run-seed.cjs"]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_SOCKET_URL: /
        NEXT_PUBLIC_SITE_URL: https://${APP_DOMAIN}
        NEXT_PUBLIC_ENABLE_DEMO: ${NEXT_PUBLIC_ENABLE_DEMO:-false}
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: ${WEB_MEMORY_LIMIT:-384m}
    cpus: ${WEB_CPU_LIMIT:-0.75}
    pids_limit: 150
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: ${CADDY_MEMORY_LIMIT:-128m}
    cpus: ${CADDY_CPU_LIMIT:-0.5}
    pids_limit: 100
    logging: *default-logging
    depends_on: [web, api]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

secrets:
  database_bootstrap_password:
    file: ${DATABASE_BOOTSTRAP_PASSWORD_FILE:-./secrets/database-bootstrap-password.example}
  database_runtime_url:
    file: ${DATABASE_RUNTIME_URL_FILE:-./secrets/database-runtime-url.example}
  database_migrator_url:
    file: ${DATABASE_MIGRATOR_URL_FILE:-./secrets/database-migrator-url.example}
  database_backup_password:
    file: ${DATABASE_BACKUP_PASSWORD_FILE:-./secrets/database-backup-password.example}

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
