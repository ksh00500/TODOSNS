name: mungsil-staging

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mungsil
      POSTGRES_USER: mungsil
      POSTGRES_PASSWORD_FILE: /run/secrets/database_bootstrap_password
    secrets:
      - database_bootstrap_password
      - database_backup_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mungsil"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: http://${PUBLIC_HOST}:${PUBLIC_PORT}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY && mc mb --ignore-existing local/$$MINIO_BUCKET"]
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}

  api:
    image: mungsil-api
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DEPLOYMENT_SECURITY_PROFILE: local-synthetic
      PORT: 4000
      WEB_ORIGIN: http://${PUBLIC_HOST}:${PUBLIC_PORT}
      SITE_ORIGIN: http://${PUBLIC_HOST}:${PUBLIC_PORT}
      DATABASE_URL_FILE: /run/secrets/database_url
      EXPECTED_DB_SESSION_ROLE: mungsil_runtime
      EXPECTED_DB_CURRENT_ROLE: mungsil_runtime
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://${PUBLIC_HOST}:${PUBLIC_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      INVITE_REQUIRED: ${INVITE_REQUIRED:-true}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Seoul}
      COOKIE_SECURE: "false"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      MEDIA_READ_URL_TTL_SECONDS: ${MEDIA_READ_URL_TTL_SECONDS:-300}
      ANALYTICS_COLLECTION_ENABLED: "false"
      ANALYTICS_EXPORT_ENABLED: "false"
    expose: ["4000"]
    secrets:
      - source: database_runtime_url
        target: database_url
    command: ["node", "apps/api/scripts/start-runtime.cjs"]

  migrate:
    image: mungsil-api
    profiles: ["migration"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      EXPECTED_DB_SESSION_ROLE: mungsil_migrator
      EXPECTED_DB_CURRENT_ROLE: mungsil_owner
    secrets:
      - source: database_migrator_url
        target: database_url
    command: ["node", "apps/api/scripts/run-migrations.cjs"]

  seed:
    image: mungsil-api
    profiles: ["seed"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      EXPECTED_DB_SESSION_ROLE: mungsil_runtime
      EXPECTED_DB_CURRENT_ROLE: mungsil_runtime
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD}
      SEED_INVITE_CODE: ${SEED_INVITE_CODE}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    secrets:
      - source: database_runtime_url
        target: database_url
    command: ["node", "apps/api/scripts/run-seed.cjs"]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_SOCKET_URL: /
        NEXT_PUBLIC_SITE_URL: http://${PUBLIC_HOST}:${PUBLIC_PORT}
        NEXT_PUBLIC_ENABLE_DEMO: "false"
    restart: unless-stopped
    depends_on: [api]
    expose: ["3000"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web, api, minio]
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET}
    ports:
      - "${PUBLIC_PORT}:8080"
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro

secrets:
  database_bootstrap_password:
    file: ${DATABASE_BOOTSTRAP_PASSWORD_FILE:-./secrets/database-bootstrap-password.example}
  database_runtime_url:
    file: ${DATABASE_RUNTIME_URL_FILE:-./secrets/database-runtime-url.example}
  database_migrator_url:
    file: ${DATABASE_MIGRATOR_URL_FILE:-./secrets/database-migrator-url.example}
  database_backup_password:
    file: ${DATABASE_BACKUP_PASSWORD_FILE:-./secrets/database-backup-password.example}

volumes:
  postgres_data:
  redis_data:
  minio_data:
