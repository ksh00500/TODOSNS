plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

if (file("google-services.json").exists()) { apply plugin: "com.google.gms.google-services" }

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains("release")
}
if (releaseTaskRequested && !keystorePropertiesFile.exists()) {
    throw new GradleException("Release signing is not configured. Copy keystore.properties.example to keystore.properties and add the upload key details.")
}

android {
    namespace "kr.kro.mungsil"
    sourceSets.main.assets.srcDir "../../../packages/content"
    sourceSets.androidTest.assets.srcDir "../../../packages/test-fixtures"
    compileSdk 36

    defaultConfig {
        applicationId "kr.kro.mungsil"
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "API_URL", '"https://mungsil.kro.kr/api/v1/"'
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

android {
    buildFeatures { compose true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = "17" }
    packaging { resources { excludes += ["META-INF/AL2.0", "META-INF/LGPL2.1"] } }
}

dependencies {
    implementation "androidx.navigation:navigation-compose:2.9.1"
    implementation "androidx.work:work-runtime-ktx:2.10.2"
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    implementation platform("com.google.firebase:firebase-bom:34.0.0")
    implementation "com.google.firebase:firebase-messaging"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2"
    implementation platform("androidx.compose:compose-bom:2025.05.01")
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.code.gson:gson:2.13.1"
    implementation "io.coil-kt:coil-compose:2.7.0"
    implementation("io.socket:socket.io-client:2.1.1") { exclude group: "org.json", module: "json" }
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
    testImplementation "junit:junit:4.13.2"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"
    androidTestImplementation platform("androidx.compose:compose-bom:2025.05.01")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
    androidTestImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
}
