<svg xmlns="http://www.w3.org/2000/svg" width="1165" height="1030" viewBox="0 0 1165 1030" role="img" aria-labelledby="title desc"><title id="title">뭉실 Android V1 상태 구조 초안</title><desc id="desc">오늘 목록, 작성 폼, 완료 후 선택적 게시, 실제 완료일 기록의 네 화면. 문서 전용 합성 데이터이며 실제 앱 화면이 아니다.</desc><g font-family="Noto Sans CJK KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><rect x="0" y="0" width="1165" height="1030" rx="0" fill="#F0EEEA"/><text x="35" y="49" font-size="15" fill="#65558F" font-weight="700">MUNGSIL · ANDROID V1</text><text x="35" y="83" font-size="29" fill="#202027" font-weight="700">빈 상태 · 조회 실패 · 완료 취소 제한</text><text x="35" y="135" font-size="21" fill="#202027" font-weight="700">05 빈 상태</text><text x="35" y="162" font-size="14" fill="#66616C" font-weight="400">서버가 빈 배열을 반환한 경우</text><rect x="35" y="185" width="350" height="740" rx="26" fill="#FAF8F5" stroke="#E5E0E6"/><text x="55" y="218" font-size="12" fill="#202027" font-weight="600">9:41</text><text x="320" y="218" font-size="18" fill="#202027" font-weight="400">···</text><text x="55" y="257" font-size="25" fill="#202027" font-weight="700">하늘님의 오늘</text><rect x="55" y="295" width="310" height="91" rx="14" fill="#E8DEFF"/><text x="73" y="334" font-size="14" fill="#66616C" font-weight="400">오늘의 흐름</text><text x="73" y="364" font-size="18" fill="#202027" font-weight="600">아직 담긴 실천이 없어요</text><text x="55" y="446" font-size="17" fill="#202027" font-weight="600">오늘의 전체 목록</text><rect x="55" y="471" width="310" height="48" rx="12" fill="#65558F"/><text x="71" y="501" font-size="16" fill="white" font-weight="600">첫 할 일 추가</text><text x="63" y="564" font-size="14" fill="#66616C" font-weight="400">거창한 목표보다 작은 한 가지부터</text><rect x="36" y="847" width="348" height="77" rx="0" fill="white"/><line x1="35" y1="847" x2="385" y2="847" stroke="#E5E0E6"/><rect x="45" y="863" width="61" height="37" rx="16" fill="#C3ECE9"/><text x="57" y="887" font-size="13" fill="#65558F" font-weight="600">오늘</text><text x="124" y="887" font-size="13" fill="#66616C" font-weight="400">탐색</text><text x="191" y="887" font-size="13" fill="#66616C" font-weight="400">TODO</text><text x="258" y="887" font-size="13" fill="#66616C" font-weight="400">챌린지</text><text x="325" y="887" font-size="13" fill="#66616C" font-weight="400">마이</text><text x="410" y="135" font-size="21" fill="#202027" font-weight="700">06 조회 실패</text><text x="410" y="162" font-size="14" fill="#66616C" font-weight="400">빈 상태와 구분 · 기존 데이터 유지</text><rect x="410" y="185" width="350" height="740" rx="26" fill="#FAF8F5" stroke="#E5E0E6"/><text x="430" y="218" font-size="12" fill="#202027" font-weight="600">9:41</text><text x="695" y="218" font-size="18" fill="#202027" font-weight="400">···</text><text x="430" y="257" font-size="21" fill="#202027" font-weight="700">목록을 확인하지 못했어요</text><text x="430" y="291" font-size="13" fill="#66616C" font-weight="400">실패한 조회를 0개로 표시하지 않아요</text><rect x="430" y="323" width="310" height="179" rx="18" fill="white" stroke="#E5E0E6"/><text x="446" y="359" font-size="15" fill="#202027" font-weight="400">연결을 확인하고 다시 시도해주세요</text><text x="446" y="391" font-size="13" fill="#66616C" font-weight="400">마지막 확인 자료는 아래에 유지해요</text><rect x="446" y="425" width="278" height="48" rx="12" fill="#65558F"/><text x="462" y="455" font-size="16" fill="white" font-weight="600">다시 불러오기</text><rect x="430" y="540" width="310" height="93" rx="16" fill="white" stroke="#E5E0E6"/><text x="446" y="575" font-size="18" fill="#202027" font-weight="600">책 10쪽 읽기</text><text x="446" y="609" font-size="13" fill="#66616C" font-weight="400">마지막 확인 자료</text><rect x="411" y="847" width="348" height="77" rx="0" fill="white"/><line x1="410" y1="847" x2="760" y2="847" stroke="#E5E0E6"/><rect x="420" y="863" width="61" height="37" rx="16" fill="#C3ECE9"/><text x="432" y="887" font-size="13" fill="#65558F" font-weight="600">오늘</text><text x="499" y="887" font-size="13" fill="#66616C" font-weight="400">탐색</text><text x="566" y="887" font-size="13" fill="#66616C" font-weight="400">TODO</text><text x="633" y="887" font-size="13" fill="#66616C" font-weight="400">챌린지</text><text x="700" y="887" font-size="13" fill="#66616C" font-weight="400">마이</text><text x="785" y="135" font-size="21" fill="#202027" font-weight="700">07 완료 취소 제한</text><text x="785" y="162" font-size="14" fill="#66616C" font-weight="400">서버의 게시 연결 제한 보존</text><rect x="785" y="185" width="350" height="740" rx="26" fill="#FAF8F5" stroke="#E5E0E6"/><text x="805" y="218" font-size="12" fill="#202027" font-weight="600">9:41</text><text x="1070" y="218" font-size="18" fill="#202027" font-weight="400">···</text><text x="805" y="257" font-size="24" fill="#202027" font-weight="700">완료 취소 안내</text><rect x="805" y="299" width="310" height="115" rx="14" fill="#C3ECE9"/><text x="821" y="340" font-size="21" fill="#202027" font-weight="600">✓ 저녁 산책 30분</text><text x="821" y="380" font-size="14" fill="#65558F" font-weight="400">완료 상태를 유지했어요</text><rect x="805" y="446" width="310" height="228" rx="18" fill="white" stroke="#E5E0E6"/><text x="821" y="488" font-size="19" fill="#202027" font-weight="600">완료를 취소하지 못했어요</text><text x="821" y="527" font-size="16" fill="#202027" font-weight="400">게시물을 먼저 삭제한 뒤</text><text x="821" y="555" font-size="16" fill="#202027" font-weight="400">완료를 취소해주세요.</text><rect x="821" y="599" width="278" height="48" rx="12" fill="#65558F"/><text x="837" y="629" font-size="16" fill="white" font-weight="600">확인</text><text x="805" y="724" font-size="14" fill="#66616C" font-weight="400">자동 게시물 삭제·권한 우회 없음</text><rect x="786" y="847" width="348" height="77" rx="0" fill="white"/><line x1="785" y1="847" x2="1135" y2="847" stroke="#E5E0E6"/><rect x="795" y="863" width="61" height="37" rx="16" fill="#C3ECE9"/><text x="807" y="887" font-size="13" fill="#65558F" font-weight="600">오늘</text><text x="874" y="887" font-size="13" fill="#66616C" font-weight="400">탐색</text><text x="941" y="887" font-size="13" fill="#66616C" font-weight="400">TODO</text><text x="1008" y="887" font-size="13" fill="#66616C" font-weight="400">챌린지</text><text x="1075" y="887" font-size="13" fill="#66616C" font-weight="400">마이</text><text x="35" y="970" font-size="14" fill="#66616C" font-weight="400">합성 예시 · 정적 구조 자료 · 토스트만으로 중요한 오류를 전달하지 않음</text><text x="35" y="999" font-size="13" fill="#66616C" font-weight="400">연결 UI·실기기 검사 결과가 아니며 접근성·200% 글자·IME 검수는 별도</text></g></svg>