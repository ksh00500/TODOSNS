5" font-size="21" fill="#202027" font-weight="700">03 완료</text><text x="785" y="162" font-size="14" fill="#66616C" font-weight="400">F-05 · 완료와 게시 선택 분리</text><rect x="785" y="185" width="350" height="740" rx="26" fill="#FAF8F5" stroke="#E5E0E6"/><text x="805" y="218" font-size="12" fill="#202027" font-weight="600">9:41</text><text x="1070" y="218" font-size="18" fill="#202027" font-weight="400">···</text><text x="805" y="260" font-size="25" fill="#202027" font-weight="700">실천을 마쳤어요</text><text x="805" y="292" font-size="14" fill="#66616C" font-weight="400">게시하지 않아도 완료는 남아요</text><rect x="805" y="327" width="310" height="167" rx="22" fill="#C3ECE9"/><text x="825" y="370" font-size="21" fill="#65558F" font-weight="700">✓ 완료</text><text x="825" y="411" font-size="23" fill="#202027" font-weight="600">저녁 산책 30분</text><text x="825" y="447" font-size="13" fill="#66616C" font-weight="400">완료 시각 18:32 · 서버 확인</text><rect x="805" y="522" width="310" height="143" rx="18" fill="white" stroke="#E5E0E6"/><text x="821" y="553" font-size="18" fill="#202027" font-weight="600">이 실천을 나눌까요?</text><text x="821" y="581" font-size="13" fill="#66616C" font-weight="400">공개 범위는 게시할 때 확인해요</text><rect x="821" y="599" width="278" height="48" rx="12" fill="#65558F"/><text x="837" y="629" font-size="16" fill="white" font-weight="600">게시하기</text><rect x="805" y="689" width="310" height="48" rx="12" fill="white" stroke="#E5E0E6"/><text x="821" y="719" font-size="16" fill="#65558F" font-weight="600">지금은 건너뛰기</text><text x="814" y="777" font-size="13" fill="#66616C" font-weight="400">완료 취소는 항목 메뉴에서 할 수 있어요</text><text x="814" y="803" font-size="13" fill="#66616C" font-weight="400">게시 연결 시 서버 제한을 안내해요</text><rect x="786" y="847" width="348" height="77" rx="0" fill="white"/><line x1="785" y1="847" x2="1135" y2="847" stroke="#E5E0E6"/><rect x="795" y="863" width="61" height="37" rx="16" fill="#C3ECE9"/><text x="807" y="887" font-size="13" fill="#65558F" font-weight="600">오늘</text><text x="874" y="887"