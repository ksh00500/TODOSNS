name: Android native

on:
  push:
    branches: [main, "codex/**"]
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build and check the native app without release keys
        working-directory: apps/android
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-checks
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
          if-no-files-found: ignore
